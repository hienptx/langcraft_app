<!DOCTYPE html>
<html>
<head>
    <title>Training Room - Matching Exercise</title>
</head>
<body>
    <h1>Training Room - Matching Exercise</h1>

    <!-- Matching Exercise Section -->
    <div id="matching-exercise" class="exercise-content">
        <p class="loading">Loading your matching exercise...</p>
    </div>

    <!-- Answer Submission Form -->
    <div id="form-section" class="form-section" style="display:none;">
        <!-- <label for="answers"><strong>Enter your matches (e.g., 1-a, 2-b, 3-c):</strong></label> -->
        <textarea id="answers" rows="6" placeholder="Type your answers here...
            Example:
            1-a
            2-b
            3-c"></textarea>
        <button onclick="submitAnswers()">Submit Answers</button>
    </div>

    <!-- Feedback Section -->
    <div id="feedback"></div>

    <script>
        // Fetch the matching exercise when page loads
        async function loadExercise() {
            try {
                const response = await fetch("/matching_exercise", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_id: "default" })
                });

                const data = await response.json();
                
                if (data.error) {
                    document.getElementById("matching-exercise").innerHTML = 
                        `<p class="error">Error: ${data.error}</p>`;
                } else {
                    document.getElementById("matching-exercise").innerHTML = 
                        `<pre>${data.exercise}</pre>`;
                    document.getElementById("form-section").style.display = "block";
                }
            } catch (error) {
                document.getElementById("matching-exercise").innerHTML = 
                    `<p class="error">Failed to load exercise: ${error.message}</p>`;
            }
        }

        // Submit answers
        function submitAnswers() {
            const answers = document.getElementById("answers").value.trim();
            
            if (!answers) {
                alert("Please enter your answers!");
                return;
            }

            document.getElementById("evaluate_answer").innerHTML = 
                `<div class="feedback">
                    <h3>Your Submitted Answers:</h3>
                    <pre>${answers}</pre>
                    <p><em>Answers submitted successfully! (Evaluation feature coming soon...)</em></p>
                </div>`;
            
            // Scroll to feedback
            document.getElementById("feedback").scrollIntoView({ behavior: 'smooth' });
        }

        // Load exercise when page loads
        window.onload = loadExercise;
    </script>
</body>         
</html>
