<!DOCTYPE html>
<html>
<head>
    <title>German Idiom Game</title>
    <link rel="stylesheet" href="/static/style_2.css">
</head>
<body>
    <h1>German Idiom Generator</h1>

    <!-- Idiom Generation Form -->
    <form id="idiom-form">
        <label for="nbr_idioms">Number of Idioms:</label>
        <input type="number" id="nbr_idioms" name="nbr_idioms" required><br>

        <label for="topic">Topic:</label>
        <input type="text" id="topic" name="topic" required><br>

        <label for="level">Level:</label>
        <input type="text" id="level" name="level" required><br>

        <button type="submit">Generate</button>
    </form>

    <hr>

    <!-- Result: Idioms -->
    <div id="result"></div>

    <!-- Evaluation Form
    <div id="evaluation-section" style="display:none;"
        <h2>Your turn</h2>
        <form id="eval-form">
            <label for="idiom">Choose an idiom</label>
            <textarea id="idiom" name="idiom" rows="1" cols="40" required></textarea><br>

            <label for="user_sentence">Your Sentence:</label>
            <textarea id="user_sentence" name="user_sentence" rows="3" cols="40" required></textarea><br>

            <button type="submit">Evaluate</button>
        </form>
        <div id="feedback"></div>
        Go to Training Room button
        <div id="training-room-link" style="display:block; margin-top: 20px;">
            <a href="/templates/training.html">
                <button type="button">Go to Training Room</button>
            </a>
        </div>
    </div> -->

    <script>
        const idiomForm = document.getElementById("idiom-form");
        const evalSection = document.getElementById("evaluation-section"); // Make sure this element exists

        function typeText(text, elementId, speed = 30) {
            const element = document.getElementById(elementId);
            element.innerText = "";
            let i = 0;
            function typeChar() {
                if (i < text.length) {
                    element.innerText += text.charAt(i);
                    i++;
                    setTimeout(typeChar, speed);
                }
            }
            typeChar();
        }

        idiomForm.addEventListener("submit", async function(e) {
            e.preventDefault();

            const res = await fetch("/generate_idioms", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    nbr_idioms: document.getElementById("nbr_idioms").value,
                    topic: document.getElementById("topic").value,
                    level: document.getElementById("level").value
                })
            });
            const data = await res.json();
            const idiomsText = data.idioms;
            // Type out the idioms with a typing effect
            typeText(idiomsText, "result", 20);
            // Show evaluation section if necessary
            evalSection.style.display = "block";
        });
    </script>
    
    <div id="training-room-link" style="display:block; margin-top: 20px;">
        <a href="/training">
            <button type="button">Go to Training Room</button>
        </a>
    </div>
</body>
<footer class="footer">Powered by langcraft</footer>
</html>
